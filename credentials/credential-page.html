<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Certificado — VelaraLoop Academy</title>
  <meta name="description" content="Certificado verificable de VelaraLoop Academy. Entiende la AI y automatiza tu trabajo con coding agents." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Certificado — VelaraLoop Academy" />
  <meta property="og:description" content="Certificado verificable de VelaraLoop Academy." />
  <meta property="og:image" content="https://loop.upvelara.com/credential/badge-ai-fluency.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root {
      --primary: #2D1B4E; --primary-light: #4A2D6F; --accent: #9B7FBF;
      --accent-light: #C4B1D9; --muted: #F8F6FA; --muted-foreground: #6B7280; --ok: #2E7D5B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--muted); color: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(45,27,78,.12); max-width: 640px; width: 100%; overflow: hidden; }
    .head { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; padding: 40px 32px 32px; text-align: center; }
    .badge { width: 150px; height: 150px; margin: 0 auto 16px; display: block; }
    .eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-light); }
    .credential { font-size: 24px; font-weight: 700; margin-top: 6px; }
    .body { padding: 32px; }
    .field { margin-bottom: 20px; }
    .field .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted-foreground); }
    .field .value { font-size: 18px; font-weight: 600; color: var(--primary); margin-top: 2px; }
    .criteria { list-style: none; margin-top: 8px; }
    .criteria li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; color: #333; }
    .criteria li:last-child { border-bottom: none; }
    .tick { color: var(--ok); font-weight: 700; }
    .verify { background: var(--muted); border: 1px solid #e6e0ef; border-radius: 12px; padding: 16px; font-size: 13px; color: var(--muted-foreground); margin-top: 24px; }
    .verify strong { color: var(--primary); }
    .verify code { background: #fff; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: var(--primary); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .btn { display: inline-block; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; text-decoration: none; text-align: center; flex: 1 1 auto; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-outline { border: 2px solid var(--primary); color: var(--primary); }
    .foot { text-align: center; padding: 20px; font-size: 12px; color: var(--muted-foreground); }
    .foot a, .verify a { color: var(--accent); text-decoration: none; }
    .state { padding: 48px 32px; text-align: center; color: var(--muted-foreground); }
    @media (max-width: 480px) { .actions { flex-direction: column; } }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="state" id="loading">Cargando certificado…</div>
  </main>

  <script>
    const API = "https://api.upvelara.com";
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    function fmtDate(iso) {
      if (!iso) return "—";
      try { return new Date(iso).toLocaleDateString("es-ES", { year: "numeric", month: "long", day: "numeric" }); }
      catch { return iso; }
    }

    function credTitle(credential) {
      const c = (credential || "").toLowerCase();
      if (c.includes("agent-automation")) return "Agent Automation";
      return "AI Fluency";
    }

    function criteria(credential) {
      const c = (credential || "").toLowerCase();
      if (c.includes("agent-automation")) {
        return ["Completó el Track B (8 módulos)", "Entregó 1 automatización real de su trabajo", "La automatización cumple sus criterios de éxito", "Documentó la verificación (governance básico)"];
      }
      return ["Completó las 12 lecciones de AI Fluency", "Aprobó el quiz final con ≥80%", "Completó el capstone (VelaraLoop, 6 fases)"];
    }

    function render(d) {
      const title = credTitle(d.credential);
      const badge = (d.credential || "").includes("agent-automation") ? "badge-agent-automation.svg" : "badge-ai-fluency.svg";
      document.title = `${d.name} — ${title} | VelaraLoop Academy`;
      const shareUrl = location.href;
      const linkedin = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`;
      document.getElementById("card").innerHTML = `
        <div class="head">
          <img class="badge" src="./${badge}" alt="Certificado VelaraLoop Academy" />
          <div class="eyebrow">VelaraLoop Academy · Certificado</div>
          <div class="credential">${title}</div>
        </div>
        <div class="body">
          <div class="field">
            <div class="label">Otorgado a</div>
            <div class="value">${escapeHtml(d.name || "—")}</div>
          </div>
          <div class="field">
            <div class="label">Fecha de emisión</div>
            <div class="value">${fmtDate(d.issuedAt)}</div>
          </div>
          <div class="field">
            <div class="label">Criterios cumplidos</div>
            <ul class="criteria">
              ${criteria(d.credential).map((c) => `<li><span class="tick">✓</span><span>${c}</span></li>`).join("")}
            </ul>
          </div>
          <div class="verify">
            <strong>Certificado verificable.</strong> ID <code>${escapeHtml(d.id)}</code>.
            Verifícalo en <a href="${shareUrl}">loop.upvelara.com/credential</a>.
            Contacto: <a href="mailto:sandra@upvelara.com">sandra@upvelara.com</a>.
          </div>
          <div class="actions">
            <a class="btn btn-primary" href="${linkedin}" target="_blank" rel="noopener noreferrer">Compartir en LinkedIn</a>
            <a class="btn btn-accent" href="https://loop.upvelara.com/courses">Más cursos →</a>
            <a class="btn btn-outline" href="https://upvelara.com/academy">Academy</a>
          </div>
        </div>
        <div class="foot">
          VelaraLoop Academy — <a href="https://upvelara.com">upvelara.com</a> ·
          "No necesitas programar. Necesitas especificar."
        </div>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function error(msg) {
      document.getElementById("card").innerHTML = `<div class="state">
        <h2 style="color:var(--primary);margin-bottom:8px">Certificado no encontrado</h2>
        <p>${escapeHtml(msg)}</p>
        <p style="margin-top:16px"><a href="https://loop.upvelara.com/courses">← Ver cursos</a></p>
      </div>`;
    }

    if (!id) {
      error("Falta el ID del certificado. Usa un enlace como /credential/?id=VL-XXXX-XXXX.");
    } else {
      fetch(`${API}/academy/certificate/${encodeURIComponent(id)}`)
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error("No encontrado"))))
        .then((d) => (d.valid ? render(d) : error("El ID no corresponde a un certificado emitido.")))
        .catch(() => error("No pudimos verificar el certificado. Revisa el enlace."));
    }
  </script>
</body>
</html>
