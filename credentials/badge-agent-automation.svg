<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="VelaraLoop Academy — Agent Automation badge">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D1B4E"/>
      <stop offset="1" stop-color="#4A2D6F"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B1D9"/>
      <stop offset="1" stop-color="#9B7FBF"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg2)"/>
  <rect x="10" y="10" width="380" height="380" rx="24" fill="none" stroke="#C4B1D9" stroke-opacity="0.6" stroke-width="3"/>

  <circle cx="200" cy="150" r="76" fill="none" stroke="url(#ring2)" stroke-width="8"/>

  <path d="M152 150 a48 48 0 1 1 14 34" fill="none" stroke="#C4B1D9" stroke-width="8" stroke-linecap="round"/>
  <path d="M146 130 l6 24 l-24 -6 z" fill="#C4B1D9"/>

  <circle cx="200" cy="150" r="30" fill="#9B7FBF" fill-opacity="0.20"/>

  <!-- role icon placeholder (gear + spark = automation) -->
  <g transform="translate(200 150)">
    <circle r="8" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-15" x2="0" y2="-19"/>
      <line x1="0" y1="15" x2="0" y2="19"/>
      <line x1="-15" y1="0" x2="-19" y2="0"/>
      <line x1="15" y1="0" x2="19" y2="0"/>
      <line x1="-11" y1="-11" x2="-14" y2="-14"/>
      <line x1="11" y1="11" x2="14" y2="14"/>
      <line x1="-11" y1="11" x2="-14" y2="14"/>
      <line x1="11" y1="-11" x2="14" y2="-14"/>
    </g>
  </g>

  <text x="200" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">AGENT AUTOMATION</text>
  <!-- ROLE: reemplazar [ROL] por el rol del alumno -->
  <text x="200" y="290" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#C4B1D9" letter-spacing="2">[ROL]</text>
  <text x="200" y="312" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9B7FBF" letter-spacing="2">VELARALOOP ACADEMY</text>

  <line x1="120" y1="330" x2="280" y2="330" stroke="#9B7FBF" stroke-opacity="0.4" stroke-width="1.5"/>

  <text x="200" y="354" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#C4B1D9" fill-opacity="0.9">Automatiza tu trabajo con coding agents</text>
  <text x="200" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#9B7FBF">upvelara.com</text>
